  <!-- Footer notes -->
  <text x="24" y="424" class="foot">Left: Go-heap Lua VMs (including Apogee JIT) scale O(VMs × objects) in Go GC; MoeLua stays near-flat via noscan Arenas (ptrdata == 0).</text>
  <text x="24" y="440" class="foot">Right: isolated subprocess per engine (256-VM idle: MoeLua 54 KiB / 0.77 ms GC vs Apogee JIT 192 KiB / 21.6 ms GC). Dashed line = off-heap mmap.</text>
