  <text x="24" y="440" class="foot">Right: isolated subprocess per engine (256-VM idle: MoeLua 52 KiB / 0.43 ms GC vs Apogee JIT 191 KiB / 23.4 ms GC). Dashed line = off-heap mmap.</text>
