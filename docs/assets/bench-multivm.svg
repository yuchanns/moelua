  <text x="24" y="440" class="foot">Right: isolated subprocess per engine (256-VM idle: MoeLua 51 KiB / 0.51 ms GC vs Apogee JIT 192 KiB / 26.5 ms GC). Dashed line = off-heap mmap.</text>
