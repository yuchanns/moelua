  <text x="24" y="440" class="foot">Right: isolated subprocess per engine (256-VM idle: MoeLua 51 KiB / 0.80 ms GC vs Apogee JIT 190 KiB / 31.3 ms GC). Dashed line = off-heap mmap.</text>
