  <!-- Footer notes -->
  <text x="24" y="424" class="foot">Left: Go-heap Lua VMs (including Apogee JIT) scale O(VMs × objects) in Go GC; MoeLua stays near-flat via noscan Arenas (ptrdata == 0).</text>
  <text x="24" y="440" class="foot">Right: isolated subprocess per engine (256-VM idle: MoeLua 53 KiB / 0.50 ms GC vs Apogee JIT 191 KiB / 20.1 ms GC). Dashed line = off-heap mmap.</text>
