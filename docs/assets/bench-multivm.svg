  <text x="24" y="440" class="foot">Right: isolated subprocess per engine (256-VM idle: MoeLua 54 KiB / 0.64 ms GC vs Apogee JIT 192 KiB / 20.4 ms GC). Dashed line = off-heap mmap.</text>
