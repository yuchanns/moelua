<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-label="MoeLua 5.5 high-density multi-VM scalability: Go GC pause from 32 to 512 active VMs and per-VM memory and cold start">
