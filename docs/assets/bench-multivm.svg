<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-label="MoeLua 5.5 high-density multi-VM scalability: Go GC pause from 64 to 1000 active VMs and per-VM memory and cold start">
