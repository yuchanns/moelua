  <text x="24" y="460" class="foot">Right: isolated subprocess per engine (256-VM idle: MoeLua 52 KiB / 0.42 ms GC vs Apogee JIT 190 KiB / 26.3 ms GC). Dashed line = off-heap mmap.</text>
