  <text x="24" y="460" class="foot">Right: isolated subprocess per engine (256-VM idle: MoeLua 52 KiB / 0.82 ms GC vs Apogee JIT 191 KiB / 31.1 ms GC). Dashed line = off-heap mmap.</text>
