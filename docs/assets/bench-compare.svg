<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-label="MoeLua 5.5 cross-engine benchmark: 27-program execution time relative to C Lua 5.5.1 -O2 and 256-VM Go GC pause">
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#e2e8f0"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#94a3b8" stroke-width="2"/>
    </pattern>
    <style>
      .bg { fill: #ffffff; }
      .border { fill: none; stroke: #e2e8f0; stroke-width: 1; }
      .title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #475569; }
      .panel-title { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
      .panel-sub { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #64748b; }
      .label { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #334155; text-anchor: end; }
      .label-hi { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #047857; text-anchor: end; }
      .val { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #334155; }
      .val-hi { font: 700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #047857; }
      .val-sub { font: 400 10.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #64748b; }
      .grid { stroke: #f1f5f9; stroke-width: 1; }
      .axis { stroke: #cbd5e1; stroke-width: 1; }
      .refline { stroke: #64748b; stroke-width: 1; stroke-dasharray: 3 3; }
      .tick { font: 400 10.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #64748b; text-anchor: middle; }
      .foot { font: 400 10.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #64748b; }
      .bar-moe { fill: #10b981; }
      .bar-other { fill: #64748b; }
      .bar-ccgo { fill: #3b82f6; }
      .bar-ref { fill: url(#hatch); stroke: #94a3b8; stroke-width: 1; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="429" rx="10" class="bg"/>
  <rect x="0.5" y="0.5" width="959" height="429" rx="10" class="border"/>

  <!-- Header -->
  <text x="24" y="30" class="title">MoeLua 5.5 vs Pure-Go Lua Engines &amp; C Lua 5.5.1</text>
  <text x="24" y="48" class="subtitle">Apple M1 Max (darwin/arm64) · Go 1.27.4 · GOMAXPROCS=1 · Lower is better in both panels</text>

  <!-- Divider -->
  <line x1="490" y1="68" x2="490" y2="386" stroke="#e2e8f0" stroke-width="1"/>

  <!-- LEFT PANEL: 27-program execution time -->
  <text x="24" y="78" class="panel-title">Execution Time (27-Program Geomean)</text>
  <text x="24" y="94" class="panel-sub">Relative to C Lua 5.5.1 -O2 (1.00x) · AWFY + Benchmarks Game + SciMark + Own</text>

  <!-- Left plot area: x0=165, width=260, max=10.0x (26px per 1x) -->
  <!-- Gridlines -->
  <line x1="165" y1="108" x2="165" y2="358" class="axis"/>
  <line x1="191" y1="108" x2="191" y2="358" class="refline"/>
  <line x1="217" y1="108" x2="217" y2="358" class="grid"/>
  <line x1="269" y1="108" x2="269" y2="358" class="grid"/>
  <line x1="321" y1="108" x2="321" y2="358" class="grid"/>
  <line x1="373" y1="108" x2="373" y2="358" class="grid"/>
  <line x1="425" y1="108" x2="425" y2="358" class="grid"/>
  <text x="165" y="373" class="tick">0x</text>
  <text x="191" y="373" class="tick">1x</text>
  <text x="217" y="373" class="tick">2x</text>
  <text x="269" y="373" class="tick">4x</text>
  <text x="321" y="373" class="tick">6x</text>
  <text x="373" y="373" class="tick">8x</text>
  <text x="425" y="373" class="tick">10x</text>
  <text x="157" y="127" class="label">C Lua 5.5.1 -O3 (ref)</text>
  <rect x="165" y="114" width="22.6" height="17" rx="3" class="bar-ref"/>
  <text x="193.6" y="127" class="val">0.87x</text>
  <text x="157" y="154" class="label">C Lua 5.5.1 -O2 (ref)</text>
  <rect x="165" y="141" width="26.0" height="17" rx="3" class="bar-ref"/>
  <text x="197.0" y="154" class="val">1.00x</text>
  <text x="157" y="181" class="label-hi">MoeLua 5.5 (Pure Go)</text>
  <rect x="165" y="168" width="33.9" height="17" rx="3" class="bar-moe"/>
  <text x="204.9" y="181" class="val-hi">1.30x</text>
  <text x="157" y="208" class="label">Apogee v1.2.1 (noJIT)</text>
  <rect x="165" y="195" width="48.9" height="17" rx="3" class="bar-other"/>
  <text x="219.9" y="208" class="val">1.88x</text>
  <text x="157" y="235" class="label">modernc/lua (CCGO)</text>
  <rect x="165" y="222" width="71.0" height="17" rx="3" class="bar-ccgo"/>
  <text x="242.0" y="235" class="val">2.73x</text>
  <text x="157" y="262" class="label">arnodel/golua (PGO)</text>
  <rect x="165" y="249" width="71.7" height="17" rx="3" class="bar-other"/>
  <text x="242.7" y="262" class="val">2.76x</text>
  <text x="157" y="289" class="label">yuin/gopher-lua</text>
  <rect x="165" y="276" width="130.6" height="17" rx="3" class="bar-other"/>
  <text x="301.6" y="289" class="val">5.02x</text>
  <text x="157" y="316" class="label">Shopify/go-lua</text>
  <rect x="165" y="303" width="170.2" height="17" rx="3" class="bar-other"/>
  <text x="341.2" y="316" class="val">6.55x</text>
  <text x="157" y="343" class="label">DCLua (milochristiansen)</text>
  <rect x="165" y="330" width="248.5" height="17" rx="3" class="bar-other"/>
  <text x="419.5" y="343" class="val">9.56x</text>

  <!-- RIGHT PANEL: 256-Active-VM Go GC Pause -->
  <text x="512" y="78" class="panel-title">Go GC Pause with 256 Active VMs</text>
  <text x="512" y="94" class="panel-sub">runtime.GC() median (ms) · 2,047 tables/VM (524K live Lua tables) · isolated process</text>

  <!-- Right plot area: x0=648, width=210, max=180ms (1.167px per ms) -->
  <line x1="648" y1="108" x2="648" y2="358" class="axis"/>
  <line x1="706.3" y1="108" x2="706.3" y2="358" class="grid"/>
  <line x1="764.7" y1="108" x2="764.7" y2="358" class="grid"/>
  <line x1="823.0" y1="108" x2="823.0" y2="358" class="grid"/>
  <line x1="858.0" y1="108" x2="858.0" y2="358" class="grid"/>
  <text x="648" y="373" class="tick">0</text>
  <text x="706.3" y="373" class="tick">50ms</text>
  <text x="764.7" y="373" class="tick">100ms</text>
  <text x="823.0" y="373" class="tick">150ms</text>
  <text x="858.0" y="373" class="tick">180ms</text>
  <text x="640" y="135" class="label-hi">MoeLua 5.5 (Arena)</text>
  <rect x="648" y="122" width="3.0" height="17" rx="3" class="bar-moe"/>
  <text x="657.0" y="135" class="val-hi">0.84 ms (326 KiB)</text>
  <text x="640" y="168" class="label">modernc/lua (mmap)</text>
  <rect x="648" y="155" width="3.0" height="17" rx="3" class="bar-ccgo"/>
  <text x="657.0" y="168" class="val">0.21 ms (277 KiB)</text>
  <text x="640" y="201" class="label">arnodel/golua</text>
  <rect x="648" y="188" width="60.7" height="17" rx="3" class="bar-other"/>
  <text x="714.7" y="201" class="val">52.0 ms (629 KiB)</text>
  <text x="640" y="234" class="label">Apogee v1.2.1 (noJIT)</text>
  <rect x="648" y="221" width="61.3" height="17" rx="3" class="bar-other"/>
  <text x="715.3" y="234" class="val">52.5 ms (516 KiB)</text>
  <text x="640" y="267" class="label">DCLua</text>
  <rect x="648" y="254" width="84.1" height="17" rx="3" class="bar-other"/>
  <text x="738.1" y="267" class="val">72.1 ms (1.1 MiB)</text>
  <text x="640" y="300" class="label">Shopify/go-lua</text>
  <rect x="648" y="287" width="97.9" height="17" rx="3" class="bar-other"/>
  <text x="751.9" y="300" class="val">84.0 ms (1.0 MiB)</text>
  <text x="640" y="333" class="label">yuin/gopher-lua</text>
  <rect x="648" y="320" width="206.1" height="17" rx="3" class="bar-other"/>
  <text x="848.1" y="333" class="val" style="fill:#ffffff;text-anchor:end">176.7 ms (2.0 MiB)</text>

  <!-- Footer notes -->
  <text x="24" y="402" class="foot">Left: median of 3 rounds via bench/compare (32/32 byte-exact output vs C Lua 5.5.1). JIT engines on the same suite: Apogee JIT 0.57x, LuaJIT 0.16x (see docs/benchmarks.md).</text>
  <text x="24" y="418" class="foot">Right: active OS RSS/VM shown in parentheses; modernc/lua allocates off-heap via mmap (1.8 KiB Go heap). MoeLua uses noscan Go []byte Arenas with per-State Lua 5.5 GC (54 KiB idle RSS/VM).</text>
</svg>
