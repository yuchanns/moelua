<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-label="MoeLua 5.5 cross-engine benchmark: 27-program execution time relative to C Lua 5.5.1 -O2 and 256-VM Go GC pause">
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#e2e8f0"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#94a3b8" stroke-width="2"/>
    </pattern>
    <style>
      .bg { fill: #ffffff; }
      .border { fill: none; stroke: #e2e8f0; stroke-width: 1; }
      .badge-bg { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; }
      .badge-txt { font: 500 10.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #475569; text-anchor: middle; }
      .title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #475569; }
      .panel-title { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
      .panel-sub { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #64748b; }
      .label { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #334155; text-anchor: end; }
      .label-hi { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #047857; text-anchor: end; }
      .val { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #334155; }
      .val-hi { font: 700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #047857; }
      .end-lbl { font: 500 10.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #475569; }
      .end-lbl-hi { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #047857; }
      .grid { stroke: #f1f5f9; stroke-width: 1; }
      .axis { stroke: #cbd5e1; stroke-width: 1; }
      .refline { stroke: #64748b; stroke-width: 1; stroke-dasharray: 3 3; }
      .leader { stroke: #cbd5e1; stroke-width: 1; fill: none; }
      .tick { font: 400 10.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #64748b; text-anchor: middle; }
      .tick-y { font: 400 10.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #64748b; text-anchor: end; }
      .foot { font: 400 10.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #64748b; }
      .bar-moe-jit { fill: #059669; }
      .bar-moe { fill: #10b981; }
      .bar-other { fill: #64748b; }
      .bar-ref { fill: url(#hatch); stroke: #94a3b8; stroke-width: 1; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="469" rx="10" class="bg"/>
  <rect x="0.5" y="0.5" width="959" height="469" rx="10" class="border"/>

  <!-- Header -->
  <text x="24" y="30" class="title">MoeLua 5.5 vs Go Lua Engines, C Lua 5.5.1 &amp; LuaJIT</text>
  <text x="24" y="48" class="subtitle">GitHub Actions (AMD EPYC 9V74 80-Core Processor, linux/amd64) · Go 1.27.1 · GOMAXPROCS=1 · Lower is better</text>
  <rect x="729.5" y="14" width="206.5" height="22" rx="6" class="badge-bg"/>
  <text x="832.8" y="29" class="badge-txt">Updated 2026-11-27 · 21ddb0d</text>

  <!-- Divider -->
  <line x1="490" y1="68" x2="490" y2="424" stroke="#e2e8f0" stroke-width="1"/>

  <!-- LEFT PANEL -->
  <text x="24" y="78" class="panel-title">Execution Time (27-Program Geomean)</text>
  <text x="24" y="94" class="panel-sub">Relative to C Lua 5.5.1 -O2 (1.00x) · AWFY + Benchmarks Game + SciMark + Own</text>

  <line x1="165.0" y1="108.0" x2="165.0" y2="398.0" class="axis"/>
  <line x1="186.7" y1="108.0" x2="186.7" y2="398.0" class="refline"/>
  <text x="165.0" y="413" class="tick">0x</text>
  <text x="186.7" y="413" class="tick">1x</text>
  <line x1="208.3" y1="108.0" x2="208.3" y2="398.0" class="grid"/>
  <text x="208.3" y="413" class="tick">2x</text>
  <line x1="251.7" y1="108.0" x2="251.7" y2="398.0" class="grid"/>
  <text x="251.7" y="413" class="tick">4x</text>
  <line x1="295.0" y1="108.0" x2="295.0" y2="398.0" class="grid"/>
  <text x="295.0" y="413" class="tick">6x</text>
  <line x1="338.3" y1="108.0" x2="338.3" y2="398.0" class="grid"/>
  <text x="338.3" y="413" class="tick">8x</text>
  <line x1="381.7" y1="108.0" x2="381.7" y2="398.0" class="grid"/>
  <text x="381.7" y="413" class="tick">10x</text>
  <line x1="425.0" y1="108.0" x2="425.0" y2="398.0" class="grid"/>
  <text x="425.0" y="413" class="tick">12x</text>
  <text x="157" y="126.0" class="label">LuaJIT 2.1 (ref)</text>
  <rect x="165.0" y="114.0" width="3.6" height="15.0" rx="3" class="bar-ref"/>
  <text x="191.7" y="126.0" class="val">0.17x</text>
  <text x="157" y="149.7" class="label-hi">MoeLua 5.5 (JIT)</text>
  <rect x="165.0" y="137.7" width="11.1" height="15.0" rx="3" class="bar-moe-jit"/>
  <text x="191.7" y="149.7" class="val-hi">0.51x</text>
  <text x="157" y="173.3" class="label">Apogee v1.2.1 (JIT)</text>
  <rect x="165.0" y="161.3" width="11.8" height="15.0" rx="3" class="bar-other"/>
  <text x="191.7" y="173.3" class="val">0.55x</text>
  <text x="157" y="197.0" class="label">C Lua 5.5.1 -O3 (ref)</text>
  <rect x="165.0" y="185.0" width="18.8" height="15.0" rx="3" class="bar-ref"/>
  <text x="191.7" y="197.0" class="val">0.87x</text>
  <text x="157" y="220.7" class="label-hi">MoeLua 5.5 (noJIT)</text>
  <rect x="165.0" y="208.7" width="21.4" height="15.0" rx="3" class="bar-moe"/>
  <text x="192.4" y="220.7" class="val-hi">0.99x</text>
  <text x="157" y="244.3" class="label">C Lua 5.5.1 -O2 (ref)</text>
  <rect x="165.0" y="232.3" width="21.7" height="15.0" rx="3" class="bar-ref"/>
  <text x="192.7" y="244.3" class="val">1.00x</text>
  <text x="157" y="268.0" class="label">Apogee v1.2.1 (noJIT)</text>
  <rect x="165.0" y="256.0" width="42.7" height="15.0" rx="3" class="bar-other"/>
  <text x="213.7" y="268.0" class="val">1.97x</text>
  <text x="157" y="291.7" class="label">modernc/lua (CCGO)</text>
  <rect x="165.0" y="279.7" width="44.5" height="15.0" rx="3" class="bar-other"/>
  <text x="215.5" y="291.7" class="val">2.05x</text>
  <text x="157" y="315.3" class="label">arnodel/golua (PGO)</text>
  <rect x="165.0" y="303.3" width="61.5" height="15.0" rx="3" class="bar-other"/>
  <text x="232.5" y="315.3" class="val">2.84x</text>
  <text x="157" y="339.0" class="label">yuin/gopher-lua</text>
  <rect x="165.0" y="327.0" width="109.3" height="15.0" rx="3" class="bar-other"/>
  <text x="280.3" y="339.0" class="val">5.05x</text>
  <text x="157" y="362.7" class="label">Shopify/go-lua</text>
  <rect x="165.0" y="350.7" width="151.9" height="15.0" rx="3" class="bar-other"/>
  <text x="322.9" y="362.7" class="val">7.01x</text>
  <text x="157" y="386.3" class="label">DCLua (milochristiansen)</text>
  <rect x="165.0" y="374.3" width="228.2" height="15.0" rx="3" class="bar-other"/>
  <text x="399.2" y="386.3" class="val">10.53x</text>

  <!-- RIGHT PANEL -->
  <text x="512" y="78" class="panel-title">Go GC Pause with 256 Active VMs</text>
  <text x="512" y="94" class="panel-sub">runtime.GC() median (ms) · 2,047 tables/VM (524K live Lua tables) · isolated process</text>

  <line x1="648.0" y1="108.0" x2="648.0" y2="398.0" class="axis"/>
  <text x="648.0" y="413" class="tick">0</text>
  <line x1="683.0" y1="108.0" x2="683.0" y2="398.0" class="grid"/>
  <text x="683.0" y="413" class="tick">50ms</text>
  <line x1="718.0" y1="108.0" x2="718.0" y2="398.0" class="grid"/>
  <text x="718.0" y="413" class="tick">100ms</text>
  <line x1="753.0" y1="108.0" x2="753.0" y2="398.0" class="grid"/>
  <text x="753.0" y="413" class="tick">150ms</text>
  <line x1="788.0" y1="108.0" x2="788.0" y2="398.0" class="grid"/>
  <text x="788.0" y="413" class="tick">200ms</text>
  <line x1="823.0" y1="108.0" x2="823.0" y2="398.0" class="grid"/>
  <text x="823.0" y="413" class="tick">250ms</text>
  <line x1="858.0" y1="108.0" x2="858.0" y2="398.0" class="grid"/>
  <text x="858.0" y="413" class="tick">300ms</text>
  <text x="640" y="130.0" class="label">modernc/lua (mmap)</text>
  <rect x="648.0" y="118.0" width="3.0" height="15.0" rx="3" class="bar-other"/>
  <text x="657.0" y="130.0" class="val">0.28 ms (298 KiB)</text>
  <text x="640" y="161.1" class="label-hi">MoeLua 5.5 (noJIT)</text>
  <rect x="648.0" y="149.1" width="3.0" height="15.0" rx="3" class="bar-moe"/>
  <text x="657.0" y="161.1" class="val-hi">1.02 ms (312 KiB)</text>
  <text x="640" y="192.2" class="label-hi">MoeLua 5.5 (JIT)</text>
  <rect x="648.0" y="180.2" width="3.0" height="15.0" rx="3" class="bar-moe-jit"/>
  <text x="657.0" y="192.2" class="val-hi">1.07 ms (313 KiB)</text>
  <text x="640" y="223.3" class="label">Apogee v1.2.1 (noJIT)</text>
  <rect x="648.0" y="211.3" width="43.2" height="15.0" rx="3" class="bar-other"/>
  <text x="697.2" y="223.3" class="val">61.7 ms (514 KiB)</text>
  <text x="640" y="254.4" class="label">Apogee v1.2.1 (JIT)</text>
  <rect x="648.0" y="242.4" width="45.4" height="15.0" rx="3" class="bar-other"/>
  <text x="699.4" y="254.4" class="val">64.9 ms (565 KiB)</text>
  <text x="640" y="285.6" class="label">arnodel/golua</text>
  <rect x="648.0" y="273.6" width="46.8" height="15.0" rx="3" class="bar-other"/>
  <text x="700.8" y="285.6" class="val">66.9 ms (625 KiB)</text>
  <text x="640" y="316.7" class="label">DCLua</text>
  <rect x="648.0" y="304.7" width="69.4" height="15.0" rx="3" class="bar-other"/>
