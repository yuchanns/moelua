  <text x="640" y="347.8" class="label">Shopify/go-lua</text>
  <rect x="648.0" y="335.8" width="77.8" height="15.0" rx="3" class="bar-other"/>
  <text x="731.8" y="347.8" class="val">111.1 ms (1024 KiB)</text>
  <text x="640" y="378.9" class="label">yuin/gopher-lua</text>
