  <!-- Footer notes -->
  <text x="24" y="442" class="foot">Left: median of 3 rounds via bench/compare (32/32 byte-exact output vs C Lua 5.5.1). Hatched bars = native C/asm references.</text>
  <text x="24" y="458" class="foot">Right: active OS RSS/VM in parentheses. modernc/lua uses off-heap mmap (4.3 KiB Go heap). MoeLua uses noscan Arenas + Lua 5.5 GC (52 KiB idle/VM).</text>
</svg>
