name: Setup Go
description: Set up the Go toolchain from a go.mod file.

inputs:
  go-version-file:
    description: Path to go.mod used to pin the Go version
    required: false
    default: go.mod
  cache:
    description: Whether to enable actions/setup-go module cache
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version-file: ${{ inputs.go-version-file }}
        cache: ${{ inputs.cache == 'true' }}
