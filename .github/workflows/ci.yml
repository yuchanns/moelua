name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/setup-go
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/setup-lua-ref
        with:
          targets: build/lua55_o2 build/luac55 build/clua_mem

      - uses: ./.github/actions/verify-go
        with:
          run-race: "true"
          run-compare: "true"
          run-gc-stress: "true"
